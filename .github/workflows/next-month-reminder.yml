# 毎月16日以降、次月の勤務表PDF（YYYY-MM.pdf）がまだ無ければ
# Issue を作って通知する（GitHub からメール／アプリに通知が届く）。
# PDF が置かれたら、その Issue を自動で閉じる。
name: 次月の勤務表リマインド

on:
  schedule:
    # 毎日 9:10（日本時間）= 0:10 UTC。16日より前は何もしない
    - cron: '10 0 * * *'
  push:
    paths:
      - '*.pdf'
  workflow_dispatch: # Actions 画面から手動で試せるように

permissions:
  contents: read
  issues: write

env:
  REMIND_AFTER_DAY: 15 # この日を過ぎたら通知する
  LABEL: 勤務表リマインド

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 次月のPDFを確認して通知
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          export TZ=Asia/Tokyo
          day=$(date +%-d)
          next=$(date -d "$(date +%Y-%m-01) +1 month" +%Y-%m)
          echo "今日: $(date +%F)  次月: $next"

          gh label create "$LABEL" --color FBCA04 --description "次月の勤務表が未アップロード" --force >/dev/null

          # 開いているリマインドのうち、PDFが置かれた月のものを閉じる
          gh issue list --state open --label "$LABEL" --json number,title \
            -q '.[] | "\(.number) \(.title)"' | while read -r num title; do
            month=$(echo "$title" | grep -oE '[0-9]{4}-[0-9]{2}' | head -1 || true)
            if [ -n "$month" ] && [ -f "$month.pdf" ]; then
              gh issue close "$num" --comment "$month.pdf がアップされたので閉じます。"
              echo "closed #$num ($month)"
            fi
          done

          if [ -f "$next.pdf" ]; then
            echo "$next.pdf はあります。通知不要"
            exit 0
          fi
          if [ "$day" -le "$REMIND_AFTER_DAY" ]; then
            echo "${REMIND_AFTER_DAY}日以前なので通知しません"
            exit 0
          fi

          title="【勤務表】$next の予定表がまだアップされていません"
          open=$(gh issue list --state open --label "$LABEL" --json title -q ".[] | select(.title | contains(\"$next\")) | .title")
          if [ -n "$open" ]; then
            # 2回目以降は数日おきにコメントでもう一度お知らせ
            if [ $(( (day - REMIND_AFTER_DAY - 1) % 3 )) -eq 0 ]; then
              num=$(gh issue list --state open --label "$LABEL" --json number,title -q ".[] | select(.title | contains(\"$next\")) | .number" | head -1)
              gh issue comment "$num" --body "@$OWNER まだ $next.pdf がアップされていません（$(date +%-m/%-d) 時点）。"
              echo "reminded on #$num"
            fi
            exit 0
          fi

          gh issue create --title "$title" --label "$LABEL" --body "@$OWNER

          ${next} の勤務表PDF（\`${next}.pdf\`）がまだアップされていません。

          「勤務表」フォルダに \`${next}.pdf\` という名前で保存してください。
          翌朝6:30に自動で送信されます（すぐ送るときは \`windows\\今すぐ送信.bat\`）。

          PDFがアップされると、このお知らせは自動で閉じます。"
          echo "created reminder for $next"

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <title>今日の勤務予定</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="facility" id="title"></div>
    <div class="date-row">
      <button id="prev" aria-label="前の日">◀</button>
      <div>
        <div class="date" id="date"></div>
        <div class="holiday" id="holiday"></div>
      </div>
      <button id="next" aria-label="次の日">▶</button>
    </div>
    <button id="todayBtn" class="today-btn" hidden>今日に戻る</button>
  </header>

  <main>
    <p class="loading" id="loading">勤務表を読み込み中…</p>
    <div class="summary" id="summary"></div>
    <section id="lists" hidden>
      <h2>出勤</h2>
      <ul class="list" id="work"></ul>
      <h2>休み</h2>
      <ul class="list off" id="off"></ul>
    </section>
    <p class="message" id="message" hidden></p>

    <details id="pdfBox" hidden>
      <summary>勤務表PDFで確認する（今日の列に色付け）</summary>
      <div class="pdf-wrap" id="pdfWrap"></div>
      <a id="pdfLink" target="_blank" rel="noopener">PDFを開く</a>
    </details>
  </main>

  <footer><span id="source"></span></footer>

  <script src="lib/pdfjs/pdf.min.js"></script>
  <script src="config.js"></script>
  <script src="js/holidays.js"></script>
  <script src="js/pdf-schedule.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
